name: collect

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min, off the hour (UTC)
  workflow_dispatch:                # manual "Run workflow" button

concurrency:
  group: collect                    # never let two polls overlap

permissions:
  contents: read
  id-token: write                   # required to get the OIDC token for WIF

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - run: python collector/collector.py
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
